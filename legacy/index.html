s-serif;letter-spacing:.08em}.badge{font-size:10px;font-weight:700;color:#699177;background:#f0f7ef;padding:7px 9px;border-radius:99px;white-space:nowrap}.body{padding:24px 26px}.field-label{font-size:12px;color:#53685b;font-weight:700;margin:0 0 9px;display:block}.upload{border:1.5px dashed #ccdbcf;border-radius:14px;background:#fbfdf9;min-height:238px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;position:relative}.upload-icon{width:52px;height:52px;display:grid;place-items:center;background:#eaf5e9;border-radius:16px;color:#4b8b61;margin-bottom:15px}.upload strong{font-size:14px}.upload p{font-size:12px;color:#95a399;line-height:1.7;margin:8px 0 16px}.upload-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.secondary{background:white;color:#41644d;border:1px solid #d9e8db;padding:9px 13px;border-radius:8px;font-size:12px;font-weight:700}.secondary:hover{background:#f0f8f0}.preview{display:none;width:100%;height:190px;object-fit:contain;border-radius:9px;background:#eef2ed;margin-bottom:12px}.filename{font-size:11px;color:#7c8c81;overflow-wrap:anywhere;margin:0 0 10px}.select-row{margin-top:21px}.select-row select{width:100%;border:1px solid #e0e8df;background:#fafcf9;color:#32473a;border-radius:9px;padding:12px;outline:none;font-size:13px}.hint{font-size:11px;line-height:1.6;color:#95a399;margin:8px 0 0}.primary{border:0;border-radius:9px;background:#245c3c;color:white;font-size:13px;font-weight:700;padding:14px 16px;width:100%;margin-top:20px}.primary:hover{background:#19482e}.primary:disabled{opacity:.55;cursor:wait}.privacy{border-top:1px solid #f0f2ee;margin-top:20px;padding-top:17px;color:#99a79e;font-size:11px;line-height:1.7}.privacy b{color:#71877a}.empty{min-height:350px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#a0ada3}.empty-icon{width:60px;height:60px;border-radius:20px;background:#f3f7f0;display:grid;place-items:center;color:#8aaf90;font-size:24px;margin-bottom:16px}.empty strong{color:#697c6e;font-size:14px}.empty p{font-size:12px;line-height:1.8;margin:8px 0}.result{display:none}.result-top{display:flex;gap:11px;align-items:center}.spark{height:38px;width:38px;display:grid;place-items:center;background:#e6f3e5;border-radius:12px;color:#4b8e61;font-size:18px}.result-top strong{display:block;font-size:13px}.result-top span{display:block;color:#96a49a;font-size:11px;margin-top:4px}.analysis{background:#f6faf4;border:1px solid #ebf2e9;border-radius:12px;padding:16px;margin-top:19px}.analysis-label{font-size:10px;font-weight:700;letter-spacing:.1em;color:#80a589}.analysis h3{font-size:16px;margin:8px 0;color:#284b35;letter-spacing:-.4px}.analysis p{font-size:12px;line-height:1.75;color:#738579;margin:0}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}.tag{font-size:10px;border-radius:99px;background:#e6f2e4;color:#638e6b;padding:6px 9px}.job-head{display:flex;align-items:center;justify-content:space-between;margin:25px 0 11px}.job-head strong{font-size:13px}.job-head span{font-size:10px;color:#99a79d}.job{border:1px solid #e9eee7;border-radius:12px;padding:16px}.job-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.job-top strong{font-size:13px}.job p{font-size:12px;line-height:1.7;color:#87958b;margin:9px 0 12px}.job-bottom{display:flex;gap:7px;flex-wrap:wrap}.job-bottom span{font-size:10px;color:#7d8c82;background:#f5f7f3;border-radius:6px;padding:6px 8px}.note{margin-top:15px;color:#99a79d;font-size:11px;line-height:1.7}.note b{color:#71877a}.banner{margin-top:18px;border:1px solid #e0eadf;border-radius:14px;background:#edf5eb;padding:19px 22px;display:flex;justify-content:space-between;gap:20px;align-items:center}.banner strong{font-size:13px}.banner p{font-size:12px;line-height:1.6;color:#839487;margin:5px 0 0}.banner-mark{font:600 11px 'Space Grotesk';color:#7b9b81;letter-spacing:.08em;white-space:nowrap}footer{text-align:center;margin-top:35px;font-size:11px;color:#a3aea5}button:focus-visible,select:focus-visible{outline:3px solid #96c7a1;outline-offset:3px}@media(max-width:760px){header{height:64px}.shell{padding:37px 18px 45px}.top{display:block}.steps{margin-top:24px;white-space:normal}.layout{grid-template-columns:1fr}.body{padding:21px}.panel-head{padding:21px}.top h1{letter-spacing:-1.7px}.nav-right .nav-caption{display:none}.banner-mark{display:none}.empty{min-height:230px}}
#camera{width:100%;height:280px;object-fit:cover;border-radius:10px;background:#e9eee7}#camera-status{margin:12px 0}.upload-actions{margin-top:10px}button:disabled{opacity:.45;cursor:not-allowed}[hidden]{display:none!important}.preview{height:280px;object-fit:cover}.upload{padding:12px}</style>
</head>
<body>
<header><nav><div class="logo"><span class="logo-mark">✳</span>picksell</div><div class="nav-right"><span class="demo">DEMO</span></div></nav></header>
<main class="shell"><div class="top"><div><h1>Let your work<br><em>open doors.</em></h1></div></div>
<div class="layout"><section class="panel"><div class="panel-head"><div><h2>Your work</h2></div><span class="badge">NO SIGN-UP</span></div><div class="body"><div class="upload" id="dropzone"><video id="camera" autoplay muted playsinline aria-label="Live camera preview"></video><img class="preview" id="image-preview" alt="Your captured photo"><p id="camera-status" role="status">Starting camera…</p><div class="upload-actions"><button class="secondary" type="button" id="start-camera" hidden>Enable camera</button><button class="secondary" type="button" id="capture-btn" disabled>◉ Capture</button><button class="secondary" type="button" id="retake-btn" hidden>Retake</button></div></div><div class="select-row"><label class="field-label" for="scenario">Demo category</label><select id="scenario"><option value="plumbing">Sink plumbing repair</option><option value="assembly">Furniture assembly</option><option value="cleaning">Home cleaning</option></select></div><button class="primary" id="analyze" type="button">Find work &nbsp; →</button><div class="privacy">Photos stay on your device.</div></div></section>
<section class="panel" aria-live="polite"><div class="panel-head"><div><h2>Opportunities</h2></div><span class="badge">SAMPLE</span></div><div class="body"><div class="empty" id="empty"><div class="empty-icon">✳</div><strong>Take a photo to begin.</strong></div><div class="result" id="result"><div class="result-top"><div class="spark">✳</div><div><strong>Your experience</strong></div></div><div class="analysis"><h3 id="result-title"></h3><div class="tags" id="tags"></div></div><div class="job-head"><strong>Sample request</strong></div><article class="job"><div class="job-top"><strong id="job-title"></strong><span class="badge">SAMPLE</span></div><div class="job-bottom"><span id="job-location"></span><span id="job-time"></span><span>Quote needed</span></div></article><p class="note">Demo category sets the results. No AI analysis or real jobs.</p></div></div></section></div></main>
<script>
const data={plumbing:{title:'Sink plumbing repair',description:'A sample experience card for inspecting or replacing pipes beneath a sink.',tags:['Plumbing','Sink','On-site work'],job:'Water is leaking under my sink',detail:'The drain connection appears to be leaking. Looking for someone to inspect and repair it.',location:'Gangnam, Seoul',time:'This evening'},assembly:{title:'Furniture assembly',description:'A sample experience card for assembling furniture such as desks and shelves.',tags:['Furniture assembly','Installation','On-site work'],job:'Help assembling a desk and shelves',detail:'Looking for someone to assemble a newly delivered desk and shelving unit.',location:'Mapo, Seoul',time:'This weekend'},cleaning:{title:'Home cleaning',description:'A sample experience card for cleaning spaces such as kitchens and bathrooms.',tags:['Cleaning','Residential','On-site work'],job:'Home cleaning before moving in',detail:'Looking for someone to clean the kitchen and bathroom before move-in.',location:'Seongdong, Seoul',time:'Tomorrow morning'}};
const $=s=>document.querySelector(s);let stream=null,captured=false,starting=false;
function stopCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('#camera').srcObject=null;}
async function startCamera(){
 if(starting)return;starting=true;$('#start-camera').hidden=true;$('#capture-btn').disabled=true;$('#camera-status').textContent='Starting camera…';
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('unsupported');
  stopCamera();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  $('#camera').hidden=false;$('#camera').srcObject=stream;await $('#camera').play();
  $('#capture-btn').disabled=false;$('#camera-status').textContent='Frame your work.';
 }catch(e){stopCamera();$('#start-camera').hidden=false;$('#camera-status').textContent=e.name==='NotAllowedError'?'Allow camera access in your browser, then try again.':e.name==='NotFoundError'?'No camera found. Try a device with a camera.':e.message==='unsupported'?'Camera needs HTTPS or localhost.':'Camera unavailable. Close other camera apps and retry.';}finally{starting=false;}
}
$('#start-camera').addEventListener('click',startCamera);
$('#capture-btn').addEventListener('click',()=>{
 const video=$('#camera');if(!video.videoWidth)return;
 const canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);
 $('#image-preview').src=canvas.toDataURL('image/jpeg',.9);$('#image-preview').style.display='block';captured=true;stopCamera();video.hidden=true;$('#capture-btn').hidden=true;$('#retake-btn').hidden=false;$('#camera-status').textContent='Photo captured.';
});
$('#retake-btn').addEventListener('click',()=>{captured=false;$('#image-preview').removeAttribute('src');$('#image-preview').style.display='none';$('#retake-btn').hidden=true;$('#capture-btn').hidden=false;$('#result').style.display='none';$('#empty').style.display='flex';startCamera();});
$('#analyze').addEventListener('click',()=>{
 if(!captured){$('#camera-status').textContent='Take a photo first.';$('#capture-btn').focus();return;}
 const d=data[$('#scenario').value];$('#result-title').textContent=d.title;$('#tags').replaceChildren(...d.tags.map(t=>{const e=document.createElement('span');e.className='tag';e.textContent=t;return e;}));$('#job-title').textContent=d.job;$('#job-location').textContent=d.location;$('#job-time').textContent=d.time;$('#empty').style.display='none';$('#result').style.display='block';if(innerWidth<761)$('#result').scrollIntoView({behavior:'smooth',block:'start'});
});
window.addEventListener('pagehide',stopCamera);startCamera();
</script></body></html>
